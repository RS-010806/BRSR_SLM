<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pramana answers questions about the GHG emissions and climate disclosures of listed Indian companies, based on their BRSR filings." />
    <meta name="theme-color" content="#f6f5f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pramana</title>
    <script>
      try {
        var t = localStorage.getItem("pramana.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
