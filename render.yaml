databases:
  - name: pramana-db
    plan: free
    databaseName: pramana
    user: pramana

services:
  - type: web
    name: pramana-brsr
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PRAMANA_RATE_PER_MIN
        value: "150"
      - key: DATABASE_URL
        fromDatabase:
          name: pramana-db
          property: connectionString
      - key: PRAMANA_ADMIN_TOKEN
        generateValue: true
